<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <fieldset>
        <legend>biodata</legend>
        <form action="#">
            <label for="name">Name:</label>
            <input type="text" name="name" id="name" placeholder="Enter your name">
            <br><br>
            <label for="pass">Passwod:</label>
            <input type="password" name="pass" id="pass" placeholder="Enter your password">
            <br><br>
            <label for="tel">phone:</label>
            <input type="tel" name="tel" id="tel" placeholder="Enter your phone number">
            <br><br>
            <label for="email">Email:</label>
            <input type="email" name="email" id="email" placeholder="Enter your email">
            <br><br>
            <label for="dob">DOB:</label>
            <input type="date" name="dob" id="dob">
            <br><br>
            <label for="add">Address:</label>
            <textarea name="add" id="add" placeholder="Enter your address"></textarea>
            <br><br>
            <label for="gender">Gender:</label>
            <input type="radio" name="gender" id="male" value="male">
            <label for="male">Male</label>
            <input type="radio" name="gender" id="female" value="female">
            <label for="female">Female</label>
            <br><br>
            <label for="hobby">Hobby:</label>
            <input type="checkbox" name="hobby one" id="hobby one">
            <label for="hobby one">painting</label>
            <input type="checkbox" name="hobby two" id="hobby two">
            <label for="hobby two">swimming</label>
            <br><br>
            <label for="language">Language:</label>
            <select name="language" id="language">
                <option value="select">Select your language</option>
                <option value="c">C</option>
                <option value="c++">C++</option>
                <option value="python">Python</option>
                <option value="java">Java</option>
            </select>
        </form>
    </fieldset>
</body>
</html>
